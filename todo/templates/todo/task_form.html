{% extends 'todo/base.html' %}

{% block title %}
Add Task | ToDo App
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Add New Task</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="title" class="form-label">Task Title</label>
            <input
                type="text"
                name="title"
                id="title"
                class="form-control"
                maxlength="200"
                required
            >
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea
                name="description"
                id="description"
                class="form-control"
                rows="4"
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Task
        </button>

        <a href="{% url 'todo:task_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
